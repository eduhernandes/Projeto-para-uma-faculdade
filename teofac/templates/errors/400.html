{% extends 'base.html' %}
{% block title %}Erro {{ code }} · {{ app_name }}{% endblock %}
{% block public_content %}<div class="error-page"><div class="error-card"><span class="error-code">{{ code }}</span><h1>Não foi possível concluir a solicitação</h1><p>{{ message }}</p><a class="button primary" href="{{ url_for('main.dashboard') if current_user else url_for('auth.login') }}">Voltar</a></div></div>{% endblock %}
